name: update-epg

on:
  schedule:
    # 每天 4 次，覆盖 00:00~00:30 的源无数据窗口
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-epg
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install opencc-python-reimplemented requests

      - name: Build EPG
        run: python scripts/build_epg.py

      - name: Fetch logos
        continue-on-error: true
        run: python scripts/fetch_logos.py

      - name: Merge live sources
        continue-on-error: true
        run: python scripts/merge_live.py

      - name: Check box sites
        continue-on-error: true
        run: python scripts/check_box_sites.py

      - name: Commit and push
        run: |
          git config user.name "epg-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "epg: auto update" || echo "no changes"
          git push
